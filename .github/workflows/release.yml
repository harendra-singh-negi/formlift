# Stages a new npm version when a GitHub release is published (tag vX.Y.Z matching package.json "version").
# No token: npm Trusted Publishing (OIDC), set up on npmjs.com → formlift → Settings → Trusted Publisher
# (GitHub Actions · harendra-singh-negi / formlift · release.yml). The version goes live only after a maintainer
# approves it on npmjs.com (Staged Packages) or with `npm stage approve <id>`.
name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # OIDC: npm verifies this run instead of a token, and adds provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm install -g npm@latest # npm stage needs npm 11.15+
      - run: npm ci
      # Skips a version that is already on npm (e.g. 0.1.0, published by hand before Trusted Publishing existed).
      - run: |
          V=$(node -p "require('./package.json').version")
          if npm view "formlift@$V" version >/dev/null 2>&1; then echo "formlift@$V already on npm, skipping"; else npm stage publish --access public; fi
